name: Android CI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - name: Bootstrap Gradle wrapper if needed
        run: chmod +x gradlew scripts/*.sh && ./scripts/bootstrap_gradle.sh --version
      - name: Static/content checks
        run: |
          python3 scripts/validate_project.py
          python3 scripts/profile_audit.py
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: siaa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
